name: Update AI model releases

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  update-releases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tsx scripts/update-releases.ts
